<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intentional Living Planner 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --terra:#9E6B5D;
  --rose:#C49A82;
  --mauve:#B2968F;
  --taupe:#D8C5BD;
  --linen:#FDFBF7;
  --white:#FFFFFF;
  --ink:#2B2523;
  --line:#E8DDD6;
  --holiday:#F5E4DC;
  --observance:#FBF5F1;
}

*{box-sizing:border-box}

html,body{margin:0;height:100%}

body{
  background:radial-gradient(circle at 50% 30%,#F3EAE4,#E2D5CD);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Arial,sans-serif;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* ---------- BOOK & RING BINDER ---------- */
.book{
  position:relative;
  width:min(1000px,100%);
  aspect-ratio:297/210;
  background:var(--linen);
  border-radius:6px 14px 14px 6px;
  box-shadow:0 22px 50px rgba(43,37,35,.28), inset 0 0 0 1px rgba(0,0,0,.05);
  overflow:visible;
}
.book::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.10),transparent 6%,transparent 94%,rgba(0,0,0,.05));
  z-index:1;
}
.binder{
  position:absolute;
  left:0;top:0;bottom:0;
  width:34px;
  background:linear-gradient(90deg,#6E5750,#C9B0A6 30%,#F4EBE5 50%,#C9B0A6 70%,#6E5750);
  box-shadow:2px 0 8px rgba(0,0,0,.2);
  border-radius:6px 0 0 6px;
  z-index:3;
}
.binder::before{
  content:"";
  position:absolute;
  top:0;bottom:0;
  left:50%;
  width:14px;
  transform:translateX(-50%);
  background:radial-gradient(circle,#4A3A35 0 4px,#DCCBC2 5px 6px,transparent 7px) 0 0/14px 60px repeat-y;
}
.binder::after{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 58px,rgba(0,0,0,.07) 58px 60px);
}

/* ---------- SIDEBAR TABS ---------- */
.tabs{
  position:absolute;
  right:-26px;
  top:24px;
  bottom:24px;
  width:58px;
  display:flex;
  flex-direction:column;
  gap:3px;
  z-index:4;
}
.tab{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:9px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#fff;
  text-decoration:none;
  padding:2px 6px;
  border-radius:0 8px 8px 0;
  background:var(--rose);
  box-shadow:2px 2px 6px rgba(0,0,0,.14);
  transition:transform .15s ease, background .15s ease;
}
.tab:nth-child(odd){background:var(--terra)}
.tab:nth-child(even){background:var(--mauve)}
.tab:hover{transform:translateX(-6px)}
.tab.on{background:var(--ink)}

/* ---------- STAGE & PAGES ---------- */
.stage{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.page{
  position:absolute;
  inset:0;
  padding:24px 80px 22px 60px;
  overflow:auto;
  background:var(--linen);
  border-radius:inherit;
}
.page h1{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:600;
  font-size:32px;
  color:var(--terra);
  margin:2px 0 6px;
  letter-spacing:.01em;
}
.page h2{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:600;
  font-size:20px;
  color:var(--terra);
  margin:0 0 8px;
}
.page h3{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--ink);
  margin:0 0 6px;
  font-weight:700;
}
.eyebrow{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.2em;
  color:var(--mauve);
  font-weight:700;
}
.muted{color:var(--mauve);font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.spacer{height:12px}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  box-shadow:0 2px 6px rgba(43,37,35,.04);
}
.card.fill{display:flex;flex-direction:column}
.card.fill textarea{flex:1}

input,textarea,select{
  font-family:inherit;
  color:var(--ink);
  background:transparent;
  border:none;
  outline:none;
  width:100%;
  font-size:13px;
}
input.line,select.line{
  border-bottom:1px solid var(--line);
  padding:6px 2px;
}
input.line:focus,textarea:focus,select:focus{border-color:var(--terra)}
textarea.lines{
  font-size:13px;
  line-height:24px;
  padding:0 4px;
  resize:none;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,var(--line) 23px,var(--line) 24px);
  background-attachment:local;
}
textarea.dotted{
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);
  background-size:18px 18px;
  background-attachment:local;
  line-height:18px;
}

.btn{
  display:inline-block;
  padding:9px 18px;
  border-radius:999px;
  background:var(--terra);
  color:#fff;
  text-decoration:none;
  font-weight:600;
  font-size:13px;
  border:1px solid var(--terra);
  cursor:pointer;
  letter-spacing:.02em;
}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--terra)}
.btn.ghost:hover{background:var(--terra);color:#fff}
.btn.big{padding:14px 34px;font-size:14px}

/* ---------- COVER ---------- */
.cover{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 80px 40px 60px;
  background:radial-gradient(circle at 50% 40%,#FFFFFF 0%,var(--linen) 65%,#F4E8E1 100%);
}
.frame{
  position:absolute;
  inset:18px 100px 18px 50px;
  border:2px solid var(--terra);
  border-radius:4px;
  pointer-events:none;
}
.frame::before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid var(--rose);
  border-radius:2px;
}
.badge{
  font-size:10px;
  letter-spacing:.3em;
  font-weight:700;
  color:var(--terra);
  border:1px solid var(--terra);
  padding:6px 18px;
  border-radius:30px;
}
.ctitle{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:64px;
  line-height:1.05;
  font-weight:600;
  color:var(--terra);
  margin:18px 0 14px;
}
.divider{
  width:120px;
  height:1px;
  background:var(--rose);
  position:relative;
  margin:6px 0 18px;
}
.divider::after{
  content:"";
  position:absolute;
  left:50%;top:-4px;
  width:8px;height:8px;
  margin-left:-4px;
  background:var(--terra);
  transform:rotate(45deg);
}
.quote{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;
  font-size:22px;
  color:var(--ink);
  max-width:520px;
  margin:0 0 28px;
  line-height:1.4;
}

/* ---------- INDEX ---------- */
.idx{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.idx a{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  text-decoration:none;
  color:var(--ink);
  font-weight:600;
  font-size:12px;
}
.idx a span.n{
  font-family:'Cormorant Garamond',serif;
  color:var(--terra);
  font-size:18px;
  font-weight:700;
}
.idx a:hover{border-color:var(--terra)}
.steps{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.6}
.steps li{margin-bottom:4px}

/* ---------- CALENDARS ---------- */
.cal{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal .dh{
  font-size:10px;
  text-transform:uppercase;
  color:var(--mauve);
  text-align:center;
  font-weight:700;
  padding:2px 0;
}
.day{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  min-height:62px;
  padding:4px 6px;
  text-decoration:none;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.day:hover{border-color:var(--terra)}
.day .n{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;line-height:1}
.day small{font-size:9px;line-height:1.2;color:var(--terra);margin-top:auto;font-weight:600}
.day.hol{background:var(--holiday)}
.day.obs{background:var(--observance)}
.day.blank{background:transparent;border:0;pointer-events:none}

.year-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.mini{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  padding:6px 8px;
}
.mini a.mt{
  display:block;
  text-align:center;
  text-decoration:none;
  color:var(--terra);
  font-family:'Cormorant Garamond',serif;
  font-size:15px;
  font-weight:700;
  margin-bottom:4px;
}
.mini .mcal{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:1px;
  font-size:8px;
  text-align:center;
}
.mini .mcal span{padding:1px 0;border-radius:3px}
.mini .mcal .hd{color:var(--mauve);font-weight:700}
.mini .mcal .hl{background:var(--holiday);color:var(--terra);font-weight:700}

/* ---------- MONTHLY ---------- */
.mbody{display:grid;grid-template-columns:1fr 230px;gap:14px;margin-top:8px}
.side{display:flex;flex-direction:column;gap:10px}
.side .card{flex:1;display:flex;flex-direction:column}
.side .card textarea{flex:1;min-height:60px}
.mnav{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mnav a{
  text-decoration:none;
  color:var(--terra);
  font-weight:700;
  font-size:12px;
  border:1px solid var(--terra);
  border-radius:999px;
  padding:4px 12px;
}
.mnav a:hover{background:var(--terra);color:#fff}

/* ---------- WEEKLY ---------- */
.week{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  height:300px;
}
.week .card{display:flex;flex-direction:column;padding:8px}
.week .card a{
  text-decoration:none;
  color:var(--ink);
  font-weight:700;
  font-size:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:4px;
  margin-bottom:4px;
}
.week .card a:hover{color:var(--terra)}
.week .card textarea{flex:1}
.bottom2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bottom2 .card textarea{height:110px}

/* ---------- DAILY ---------- */
.daily{display:grid;grid-template-columns:1fr 290px;gap:14px;margin-top:8px;height:calc(100% - 90px)}
.timeblock{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hourrow{
  display:grid;
  grid-template-columns:60px 1fr;
  border-bottom:1px solid var(--line);
  min-height:30px;
  flex:1;
}
.hourrow:last-child{border-bottom:0}
.hourrow .t{
  font-size:11px;
  color:var(--terra);
  font-weight:700;
  padding:6px 8px;
  border-right:1px solid var(--line);
  background:#FCF7F3;
}
.hourrow input{padding:4px 8px;font-size:12px}
.dside{display:flex;flex-direction:column;gap:10px;overflow:auto}
.dside .card{padding:10px 12px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tog{
  background:var(--white);
  border:1px solid var(--taupe);
  border-radius:8px;
  padding:6px 9px;
  font-family:inherit;
  font-size:11px;
  color:var(--ink);
  cursor:pointer;
  text-align:left;
}
.tog.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.tog.round{border-radius:50%;width:26px;height:26px;padding:0}
.hlist{display:flex;flex-direction:column;gap:5px}
.hlist .tog{width:100%}

/* ---------- WELLNESS ---------- */
.hgrid{
  display:grid;
  grid-template-columns:150px repeat(31,1fr) 52px;
  gap:3px;
  align-items:center;
  margin-top:8px;
}
.hgrid .hd{
  font-size:9px;
  color:var(--mauve);
  text-align:center;
  font-weight:700;
}
.hgrid input{font-size:12px;padding:4px 2px;border-bottom:1px solid var(--line)}
.hgrid .cell{
  width:100%;
  aspect-ratio:1;
  padding:0;
  border-radius:4px;
  border:1px solid var(--taupe);
  background:var(--white);
  cursor:pointer;
}
.hgrid .cell.on{background:var(--terra);border-color:var(--terra)}
.hgrid .cell.empty{visibility:hidden}
.hgrid .sum{font-size:11px;font-weight:700;color:var(--terra);text-align:center}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--terra));border-radius:999px}

/* ---------- TABLES (FINANCE & READING) ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{
  text-align:left;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--terra);
  border-bottom:1px solid var(--terra);
  padding:6px 4px;
}
table.t td{border-bottom:1px solid var(--line);padding:2px 4px}
table.t td input{padding:6px 2px;font-size:12px}
table.t td.num{text-align:right;font-weight:600}
table.t tr.total td{font-weight:700;color:var(--terra);border-top:1px solid var(--terra)}
.del{
  background:none;
  border:none;
  color:var(--mauve);
  font-size:16px;
  cursor:pointer;
  padding:0 4px;
}
.del:hover{color:var(--terra)}
.scroll{max-height:300px;overflow:auto}
.addbook{display:grid;grid-template-columns:2fr 1.4fr 0.8fr 1fr 0.8fr auto;gap:8px;align-items:center;margin-top:8px}
.addbook input,.addbook select{font-size:12px;border-bottom:1px solid var(--line);padding:6px 2px}

/* ---------- CUSTOM & NOTES ---------- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:calc(100% - 90px);margin-top:8px}
.cgrid .card{display:flex;flex-direction:column}
.cgrid textarea{flex:1}
.cgrid .title-input{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--terra);border-bottom:1px solid var(--line);padding:2px 0 6px;margin-bottom:6px}
.notes-wrap{display:grid;grid-template-columns:2fr 1fr;gap:12px;height:calc(100% - 90px);margin-top:8px}
.notes-wrap .card{display:flex;flex-direction:column}
.notes-wrap textarea{flex:1}

/* ---------- RESPONSIVE (small screens) ---------- */
@media (max-width:760px){
  .page{padding:20px 60px 18px 48px}
  .idx{grid-template-columns:1fr 1fr}
  .mbody,.daily,.fgrid,.bottom2,.notes-wrap,.cgrid{grid-template-columns:1fr}
  .year-grid{grid-template-columns:repeat(2,1fr)}
  .tab{font-size:7px}
  .ctitle{font-size:44px}
}

/* ---------- PRINT / PDF ---------- */
@page{ size:A4 landscape; margin:0; }
@media print{
  html,body{background:none;height:auto;padding:0;display:block}
  .book{
    width:297mm;
    height:210mm;
    aspect-ratio:auto;
    box-shadow:none;
    border-radius:0;
    overflow:hidden;
  }
  .book::before{display:none}
  .tabs,.no-print{display:none!important}
  .stage{position:absolute;inset:0}
  .page{
    position:absolute;
    inset:0;
    overflow:hidden;
    padding:12mm 14mm 12mm 26mm;
    border-radius:0;
  }
  .frame{inset:8mm 8mm 8mm 22mm}
  .card,.day,.tog,.hgrid .cell,.mini,.timeblock{break-inside:avoid}
}
</style>
</head>
<body>

<div class="book" id="book">
  <div class="binder" aria-hidden="true"></div>
  <nav class="tabs" id="tabs" aria-label="Planner sections"></nav>
  <main class="stage" id="stage"></main>
</div>

<script>
/* =========================================================
   CONSTANTS & DATE HELPERS
   ========================================================= */
const YEAR = 2027;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const HABITS = ['Drink water','Move my body','Read','Sleep 7+ hours','Journal','Mindfulness','Learn something','Connect with someone'];
const BUDGET_CATS = ['Housing','Utilities','Groceries','Transport','Health','Savings','Entertainment','Other'];
const MOODS = ['Great','Good','Okay','Low','Tough'];
const KEY = 'intentionalPlanner2027';

const pad = n => String(n).padStart(2,'0');
const iso = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;          // m is 1-based
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const toISO = dt => iso(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return toISO(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod = (n,m) => ((n % m) + m) % m;

function nthWeekday(y,m,wd,n){
  const first = new Date(y,m-1,1);
  const off = mod(wd - first.getDay(), 7);
  return iso(y,m,1 + off + (n-1)*7);
}
function lastWeekday(y,m,wd){
  const last = new Date(y,m,0);
  const off = mod(last.getDay() - wd, 7);
  return iso(y,m,last.getDate() - off);
}
/* Anonymous Gregorian algorithm for Easter Sunday */
function easter(y){
  const a = y % 19, b = Math.floor(y/100), c = y % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3);
  const h = mod(19*a + b - d - g + 15, 30);
  const i = Math.floor(c/4), k = c % 4;
  const l = mod(32 + 2*e + 2*i - h - k, 7);
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return iso(y, month, day);
}

const HOLIDAYS = (() => {
  const H = {};
  const add = (k, name, type) => { H[k] = { name, type }; };
  add(iso(YEAR,1,1), "New Year's Day", 'hol');
  add(nthWeekday(YEAR,1,1,3), 'Martin Luther King Jr. Day', 'hol');
  add(iso(YEAR,2,14), "Valentine's Day", 'obs');
  add(nthWeekday(YEAR,2,1,3), "Presidents' Day", 'hol');
  add(iso(YEAR,3,8), "International Women's Day", 'obs');
  add(iso(YEAR,3,17), "St. Patrick's Day", 'obs');
  add(iso(YEAR,3,20), 'International Day of Happiness', 'obs');
  add(easter(YEAR), 'Easter Sunday', 'obs');
  add(iso(YEAR,4,22), 'Earth Day', 'obs');
  add(iso(YEAR,6,5), 'World Environment Day', 'obs');
  add(nthWeekday(YEAR,5,0,2), "Mother's Day", 'obs');
  add(lastWeekday(YEAR,5,1), 'Memorial Day', 'hol');
  add(iso(YEAR,6,19), 'Juneteenth', 'hol');
  add(nthWeekday(YEAR,6,0,3), "Father's Day", 'obs');
  add(iso(YEAR,7,4), 'Independence Day', 'hol');
  add(nthWeekday(YEAR,9,1,1), 'Labor Day', 'hol');
  add(iso(YEAR,10,10), 'World Mental Health Day', 'obs');
  add(nthWeekday(YEAR,10,1,2), "Columbus / Indigenous Peoples' Day", 'hol');
  add(iso(YEAR,10,31), 'Halloween', 'obs');
  add(iso(YEAR,11,11), 'Veterans Day', 'hol');
  add(nthWeekday(YEAR,11,4,4), 'Thanksgiving', 'hol');
  add(iso(YEAR,12,10), 'Human Rights Day', 'obs');
  add(iso(YEAR,12,25), 'Christmas Day', 'hol');
  return H;
})();

/* =========================================================
   STORAGE (saved in this browser only)
   ========================================================= */
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
const on = k => !!store[k];
const weekStartIndex = () => store.weekStart === 'mon' ? 1 : 0;
const startOfWeek = s => {
  const d = parseISO(s);
  const diff = mod(d.getDay() - weekStartIndex(), 7);
  d.setDate(d.getDate() - diff);
  return toISO(d);
};
const habitName = i => store['habit-'+i] || HABITS[i];
const fmt = v => (v < 0 ? '-' : '') + '$' + Math.abs(v).toFixed(2);

/* =========================================================
   REUSABLE BLOCKS
   ========================================================= */
function dayCell(y,m,d){
  const key = iso(y,m,d);
  const h = HOLIDAYS[key];
  const cls = h ? (h.type === 'hol' ? 'hol' : 'obs') : '';
  return `<a class="day ${cls}" href="#daily/${key}" title="${esc(h ? h.name : '')}">
            <span class="n">${d}</span>${h ? `<small>${esc(h.name)}</small>` : ''}
          </a>`;
}
function leadingBlanks(n){ return '<div class="day blank"></div>'.repeat(n); }
function weekdayHeaders(){
  const ws = weekStartIndex();
  const names = DOW_SHORT.slice(ws).concat(DOW_SHORT.slice(0,ws));
  return names.map(n => `<div class="dh">${n}</div>`).join('');
}
function miniMonth(m){
  const first = new Date(YEAR,m-1,1);
  const ws = weekStartIndex();
  const off = mod(first.getDay() - ws, 7);
  const days = new Date(YEAR,m,0).getDate();
  const names = DOW_SHORT.slice(ws).concat(DOW_SHORT.slice(0,ws));
  let cells = names.map(n => `<span class="hd">${n[0]}</span>`).join('');
  cells += '<span></span>'.repeat(off);
  for(let d=1; d<=days; d++){
    const h = HOLIDAYS[iso(YEAR,m,d)];
    cells += `<span class="${h && h.type==='hol' ? 'hl' : ''}">${d}</span>`;
  }
  return cells;
}
function nav(prevHref, nextHref, label){
  return `<div class="mnav">
    <a href="${prevHref}">&larr; Prev</a>
    <strong style="font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--ink)">${esc(label)}</strong>
    <a href="${nextHref}">Next &rarr;</a>
  </div>`;
}

  let m = parseInt(p,10);

  store.lastWellMonth = m;
  const days = new Date(YEAR,m,0).getDate();
  let header = '<div></div>';
  for(let d=1; d<=31; d++) header += `<div class="hd">${d <= days ? d : ''}</div>`;
  header += '<div class="hd">Done</div>';
  const rows = HABITS.map((_,i) => {
    let row = `<input data-save="habit-${i}" placeholder="${esc(HABITS[i])}">`;
    let done = 0;
    for(let d=1; d<=31; d++){
      if(d > days){ row += '<span class="cell empty"></span>'; continue; }
      const k = `hk-${m}-${i}-${d}`;
      if(on(k)) done++;
      row += `<button class="cell ${on(k)?'on':''}" data-toggle="${k}" aria-pressed="${on(k)}" aria-label="${HABITS[i]} day ${d}"></button>`;
    }
    row += `<div class="sum">${done}</div>`;
    return row;
  }).join('');
  const prev = m === 1 ? 12 : m-1;
  const next = m === 12 ? 1 : m+1;
  return `
  <section class="page">
    <div class="eyebrow">Habit &amp; Wellness Tracker</div>
    ${nav(`#wellness/${prev}`, `#wellness/${next}`, MONTHS[m-1] + ' 2027')}

function route(){
  const raw = decodeURIComponent(location.hash.replace('#','')) || 'cover';
  const [name, param] = raw.split('/');
  const pageName = PAGES[name] ? name : 'cover';
  stage.innerHTML = PAGES[pageName](param);
  restoreFields();
  renderTabs(pageName);
  const page = stage.querySelector('.page');
  if(page) page.scrollTop = 0;
  save();
}

/* =========================================================
   FINANCE TOTALS
   ========================================================= */
function recalcFinance(){
  const plan = [...document.querySelectorAll('.fin-plan')].reduce((s,el) => s + (parseFloat(el.value) || 0), 0);
  const act  = [...document.querySelectorAll('.fin-act')].reduce((s,el) => s + (parseFloat(el.value) || 0), 0);
  const set = (id,v) => { const el = document.getElementById(id); if(el) el.textContent = fmt(v); };
  set('fin-plan-total', plan);
  set('fin-act-total', act);
  set('fin-left', plan - act);
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.save){
    store[t.dataset.save] = t.value;
    save();
  }
  if(t.classList && t.classList.contains('fin')) recalcFinance();
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.save){
    store[t.dataset.save] = t.value;
    save();
    if(t.dataset.rerender) route();
  }
});

document.addEventListener('click', e => {
  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const k = tg.dataset.toggle;
    store[k] = !store[k];
    save();
    tg.classList.toggle('on', !!store[k]);
    tg.setAttribute('aria-pressed', !!store[k]);
    return;
  }

  const act = e.target.closest('[data-action]');
  if(!act) return;
  const type = act.dataset.action;

  if(type === 'print'){
    window.print();
  }

  if(type === 'add-book'){
    const title = document.getElementById('bk-title').value.trim();
    if(!title) return;
    const books = Array.isArray(store.books) ? store.books : [];
    books.push({
      title,
      author: document.getElementById('bk-author').value.trim(),
      pages: document.getElementById('bk-pages').value,
      status: document.getElementById('bk-status').value,
      rating: document.getElementById('bk-rating').value
    });
    store.books = books;
    save();
    route();
  }

  if(type === 'del-book'){
    const i = parseInt(act.dataset.i, 10);
    const books = Array.isArray(store.books) ? store.books : [];
    if(!isNaN(i)){
      books.splice(i,1);
      store.books = books;
      save();
      route();
    }
  }
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
