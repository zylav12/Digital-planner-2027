<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 Ultimate Intentional Life Planner — 480 Pages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

  :root {
    /* Palet Warna Muted Sage & Warm Earth Tone */
    --sage-dark: #4A6050;      /* Aksen Utama & Tab Aktif */
    --sage-soft: #8C9C89;      /* Tab Sekunder */
    --terracotta-soft: #C49A82;/* Warm Highlights */
    --paper-bg: #FAF8F5;       /* Warna Kertas Linen Warm */
    --card-bg: #FFFFFF;        /* Background Kartu */
    --ink-main: #2C322E;       /* Teks Utama */
    --ink-muted: #6E7771;      /* Teks Muted */
    --border-line: #E3DDD5;    /* Garis Pembatas */
    --bg-binder: #E8E3DD;      /* Latar Belakang Binder / Meja */
    --dot-color: #D3CBC1;      /* Pola Titik Notes */
  }

  @page {
    size: A4 landscape;
    margin: 0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-binder);
    color: var(--ink-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Kontainer Utama Halaman Planner (A4 Landscape) */
  .page {
    position: relative;
    width: 297mm;
    height: 210mm;
    background-color: var(--paper-bg);
    /* [ARAHAN 2] Jika mengunggah tekstur kertas dari Canva, hilangkan tanda komentar berikut: */
    /* background-image: url('paper-texture.png'); background-size: cover; */
    margin: 20px auto;
    padding: 12mm 30mm 12mm 18mm;
    overflow: hidden;
    page-break-after: always;
    border-radius: 4px;
    box-shadow: 
      0 12px 30px rgba(45, 40, 35, 0.12),
      0 2px 6px rgba(45, 40, 35, 0.06),
      -4px 0 10px rgba(0, 0, 0, 0.03);
  }

  /* Efek Bayangan Lipatan Buku / Spine Realistis */
  .page::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 12mm; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.03) 40%, rgba(0,0,0,0) 100%);
    pointer-events: none;
    z-index: 5;
  }

  /* Header Topbar & Footer */
  .topbar {
    font-size: 8.5pt;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--sage-dark);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .homebtn {
    position: absolute;
    top: 10mm;
    right: 28mm;
    font-size: 7.5pt;
    font-weight: 600;
    text-decoration: none;
    color: var(--terracotta-soft);
    border: 1px solid var(--terracotta-soft);
    padding: 2px 10px;
    border-radius: 12px;
    background: #FFF;
    z-index: 6;
  }

  .footer {
    position: absolute;
    bottom: 6mm; left: 18mm;
    font-size: 7pt;
    color: var(--ink-muted);
    letter-spacing: 0.5px;
  }

  .pnum {
    position: absolute;
    bottom: 6mm; right: 28mm;
    font-size: 7.5pt;
    color: var(--ink-muted);
    font-weight: 600;
  }

  /* Judul */
  h1, h2, h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    color: var(--sage-dark);
    margin: 0 0 6px 0;
  }
  h1 { font-size: 22pt; }
  h3 { font-size: 11pt; color: var(--ink-main); }
  .sub { font-size: 8.5pt; color: var(--ink-muted); margin-bottom: 6px; }

  /* Tab Navigasi Samping (3D Realistic) */
  .tabs {
    position: absolute;
    right: 0; top: 12mm; bottom: 12mm;
    width: 14mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }

  .tab {
    display: block;
    width: 100%;
    padding: 3px 0;
    background: var(--sage-soft);
    color: #FFFFFF;
    text-decoration: none;
    font-size: 6.5pt;
    font-weight: 600;
    text-align: center;
    border-radius: 0 5px 5px 0;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.12);
  }

  .tab:hover { background: var(--sage-dark); }

  /* Layout Kartu & Komponen Isi */
  .card {
    background: var(--card-bg);
