<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 Ultimate Intentional Life Planner — 480 Pages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

  :root {
    /* Palet Warna Muted Sage & Warm Earth Tone */
    --sage-dark: #4A6050;      /* Aksen Utama & Tab Aktif */
    --sage-soft: #8C9C89;      /* Tab Sekunder */
    --terracotta-soft: #C49A82;/* Warm Highlights */
    --paper-bg: #FAF8F5;       /* Warna Kertas Linen Warm */
    --card-bg: #FFFFFF;        /* Background Kartu */
    --ink-main: #2C322E;       /* Teks Utama */
    --ink-muted: #6E7771;      /* Teks Muted */
    --border-line: #E3DDD5;    /* Garis Pembatas */
    --bg-binder: #E8E3DD;      /* Latar Belakang Binder / Meja */
    --dot-color: #D3CBC1;      /* Pola Titik Notes */
  }

  @page {
    size: A4 landscape;
    margin: 0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-binder);
    color: var(--ink-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Kontainer Utama Halaman Planner (A4 Landscape) */
  .page {
    position: relative;
    width: 297mm;
    height: 210mm;
    background-color: var(--paper-bg);
    /* [ARAHAN 2] Jika mengunggah tekstur kertas dari Canva, hilangkan tanda komentar berikut: */
    /* background-image: url('paper-texture.png'); background-size: cover; */
    margin: 20px auto;
    padding: 12mm 30mm 12mm 18mm;
    overflow: hidden;
    page-break-after: always;
    border-radius: 4px;
    box-shadow: 
      0 12px 30px rgba(45, 40, 35, 0.12),
      0 2px 6px rgba(45, 40, 35, 0.06),
      -4px 0 10px rgba(0, 0, 0, 0.03);
  }

  /* Efek Bayangan Lipatan Buku / Spine Realistis */
  .page::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 12mm; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.03) 40%, rgba(0,0,0,0) 100%);
    pointer-events: none;
    z-index: 5;
  }

  /* Header Topbar & Footer */
  .topbar {
    font-size: 8.5pt;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--sage-dark);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .homebtn {
    position: absolute;
    top: 10mm;
    right: 28mm;
    font-size: 7.5pt;
    font-weight: 600;
    text-decoration: none;
    color: var(--terracotta-soft);
    border: 1px solid var(--terracotta-soft);
    padding: 2px 10px;
    border-radius: 12px;
    background: #FFF;
    z-index: 6;
  }

  .footer {
    position: absolute;
    bottom: 6mm; left: 18mm;
    font-size: 7pt;
    color: var(--ink-muted);
    letter-spacing: 0.5px;
  }

  .pnum {
    position: absolute;
    bottom: 6mm; right: 28mm;
    font-size: 7.5pt;
    color: var(--ink-muted);
    font-weight: 600;
  }

  /* Judul */
  h1, h2, h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    color: var(--sage-dark);
    margin: 0 0 6px 0;
  }
  h1 { font-size: 22pt; }
  h3 { font-size: 11pt; color: var(--ink-main); }
  .sub { font-size: 8.5pt; color: var(--ink-muted); margin-bottom: 6px; }

  /* Tab Navigasi Samping (3D Realistic) */
  .tabs {
    position: absolute;
    right: 0; top: 12mm; bottom: 12mm;
    width: 14mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }

  .tab {
    display: block;
    width: 100%;
    padding: 3px 0;
    background: var(--sage-soft);
    color: #FFFFFF;
    text-decoration: none;
    font-size: 6.5pt;
    font-weight: 600;
    text-align: center;
    border-radius: 0 5px 5px 0;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.12);
  }

  .tab:hover { background: var(--sage-dark); }

  /* Layout Kartu & Komponen Isi */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-line);
    border-radius: 6px;
    padding: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    display: flex;
    flex-direction: column;
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* Baris Catatan Elegan */
  .lines {
    width: 100%;
    flex: 1;
    min-height: 50px;
    border: none;
    background: repeating-linear-gradient(transparent, transparent 19px, var(--border-line) 20px);
    line-height: 20px;
    font-family: inherit;
    font-size: 8.5pt;
    color: var(--ink-main);
    resize: none;
    outline: none;
  }

  /* Checklist Elegan */
  .checklist div {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .check {
    width: 13px; height: 13px;
    border: 1px solid var(--sage-soft);
    border-radius: 3px;
    flex-shrink: 0;
  }
  .checklist input {
    flex: 1;
    border: none;
    border-bottom: 1px solid var(--border-line);
    background: transparent;
    font-size: 8.5pt;
    padding: 2px 0;
    outline: none;
  }

  /* Kalender Bulanan & Tahunan */
  .mhead { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--sage-dark); padding-bottom: 2px; margin-bottom: 8px; }
  .mbody { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; height: 140mm; }
  .side { display: flex; flex-direction: column; gap: 8px; }

  .dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; font-size: 7.5pt; color: var(--sage-dark); margin-bottom: 4px; background: rgba(140, 156, 137, 0.15); padding: 4px 0; border-radius: 4px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; height: 125mm; }
  .c { border: 1px solid var(--border-line); border-radius: 4px; padding: 4px; font-size: 7.5pt; background: var(--card-bg); display: flex; flex-direction: column; justify-content: space-between; }
  .c.empty { background: transparent; border: none; }
  .c.ev { border-color: var(--terracotta-soft); background: #FFFDFB; }
  .c.ev i { font-size: 6pt; color: var(--terracotta-soft); font-style: normal; display: block; margin-top: 2px; }

  .yeargrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; height: 140mm; }
  .mini { border: 1px solid var(--border-line); border-radius: 4px; padding: 5px; background: var(--card-bg); font-size: 6.5pt; }
  .mini h3 { font-size: 8.5pt; margin-bottom: 2px; text-align: center; }
  .mini table { width: 100%; border-collapse: collapse; text-align: center; }
  .mini th { color: var(--sage-dark); font-size: 6pt; }
  .mini td { padding: 1px; font-size: 6pt; }

  /* Mingguan & Harian */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; height: 110mm; }
  .daily { display: grid; grid-template-columns: 55mm 1fr; gap: 10px; height: 135mm; }
  .hours { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border-line); border-radius: 6px; padding: 6px; background: var(--card-bg); font-size: 7.5pt; }
  .hour { border-bottom: 1px dashed var(--border-line); padding: 2px 0; color: var(--ink-muted); }
  .water { display: flex; gap: 6px; margin: 4px 0; }

  /* Master Index */
  .idx { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .idx a { display: block; padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--border-line); border-radius: 6px; text-decoration: none; color: var(--ink-main); font-weight: 500; font-size: 9pt; }
  .idx a b { color: var(--sage-dark); margin-right: 8px; font-family: 'Cormorant Garamond', serif; font-size: 11pt; }
  .heroGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 140mm; }
  .note { height: 140mm; border: 1px solid var(--border-line); border-radius: 6px; padding: 10px; background: var(--card-bg); }

  /* [ARAHAN 2] Halaman Cover (Dapat diganti dengan gambar Canva) */
  .page.cover {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #FAF8F5 0%, #E8E3DD 100%);
  }
  /* Jika menggunakan Cover Gambar buatan Canva, tambahkan class 'canva-cover' pada elemen cover */
  .page.cover.canva-cover {
    background-image: url('cover-canva1.png'); /* File cover dari Canva */
    background-size: cover;
    background-position: center;
  }
  .frame { position: absolute; top: 12mm; bottom: 12mm; left: 15mm; right: 25mm; border: 2px solid var(--sage-dark); pointer-events: none; }
  .badge { background: var(--sage-dark); color: #FFF; padding: 4px 14px; border-radius: 20px; font-size: 8pt; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 15px; }
  .ctitle { font-size: 32pt; color: var(--sage-dark); line-height: 1.1; margin-bottom: 10px; }
  .divider { width: 50px; height: 2px; background: var(--terracotta-soft); margin: 0 auto 15px auto; }
  .quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13pt; color: var(--ink-muted); margin-bottom: 25px; }
  .start { display: inline-block; padding: 8px 20px; background: var(--terracotta-soft); color: #FFF; text-decoration: none; border-radius: 20px; font-size: 8.5pt; font-weight: 600; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const EVENTS={'1-1':"New Year's Day",'2-4':'World Cancer Day','3-8':"Int'l Women's Day",'3-20':'Intl Day of Happiness','4-22':'Earth Day','6-5':'World Environment Day','7-30':'Intl Day of Friendship','8-12':'Intl Youth Day','9-21':'Intl Day of Peace','10-10':'World Mental Health Day','11-16':'Intl Day for Tolerance','12-10':'Human Rights Day'};
const pad=n=>String(n).padStart(2,'0');
const app=document.getElementById('app');
let pages=[];

function page(id,section,title,body,cls=''){
  pages.push(`<section class="page ${cls}" id="${id}" data-section="${section}"><div class="topbar">${section}</div><a class="homebtn" href="#index">HOME</a><div>${body}</div><div class="footer">2027 ULTIMATE INTENTIONAL LIFE PLANNER</div><div class="pnum"></div></section>`);
}
function linesCard(title='Notes',height='') { return `<div class="card" style="${height}"><h3>${title}</h3><textarea class="lines"></textarea></div>`; }
function checklist(title,items=6){
 let s=`<div class="card"><h3>${title}</h3><div class="checklist">`;
 for(let i=1;i<=items;i++) s+=`<div><span class="check"></span><input placeholder=""></div>`;
 return s+'</div></div>';
}
function monthlyCalendar(m){
 const first=new Date(2027,m,1),off=(first.getDay()+6)%7,n=new Date(2027,m+1,0).getDate();
 let cells=''; for(let i=0;i<off;i++)cells+='<div class="c empty"></div>';
 for(let d=1;d<=n;d++){let ev=EVENTS[(m+1)+'-'+d];cells+=`<div class="c ${ev?'ev':''}"><b>${d}</b>${ev?`<i>${ev}</i>`:''}</div>`}
 return `<div class="dow">${DAYS.map(x=>`<span>${x}</span>`).join('')}</div><div class="cal">${cells}</div>`;
}
function monthPage(m){
 page('m-'+pad(m+1),pad(m+1),`Monthly • ${MONTHS[m]}`,`
 <div class="mhead"><span class="sub">2027</span><h1>${MONTHS[m]}</h1></div>
 <div class="mbody"><div>${monthlyCalendar(m)}</div><div class="side">
 ${linesCard('Monthly Goals')} ${linesCard('Key Dates & Focus')} ${linesCard('Monthly Review')}
 </div></div>`);
}
function weeklyPage(w,m,weekStart){
 const start=new Date(2027,0,4+7*w), end=new Date(start); end.setDate(start.getDate()+6);
 const label=`${MONTHS[start.getMonth()].slice(0,3)} ${start.getDate()}–${MONTHS[end.getMonth()].slice(0,3)} ${end.getDate()}, 2027`;
 page('week-'+pad(w+1),'Weekly',`Week ${w+1}`,`
 <div class="sub">${label}</div><h1>Weekly Focus</h1>
 <div class="grid3" style="margin:6px 0"><div class="card"><h3>Weekly Intention</h3><input style="border:none;border-bottom:1px solid var(--border-line);width:100%"></div><div class="card"><h3>Top 3 Priorities</h3><input style="border:none;border-bottom:1px solid var(--border-line);width:100%;margin-bottom:2px"><input style="border:none;border-bottom:1px solid var(--border-line);width:100%;margin-bottom:2px"><input style="border:none;border-bottom:1px solid var(--border-line);width:100%"></div><div class="card"><h3>Habit Focus</h3><input style="border:none;border-bottom:1px solid var(--border-line);width:100%;margin-bottom:2px"><input style="border:none;border-bottom:1px solid var(--border-line);width:100%;margin-bottom:2px"><input style="border:none;border-bottom:1px solid var(--border-line);width:100%"></div></div>
 <div class="week">${DAYS.map((d,i)=>`<div class="card"><h3>${d}</h3><small style="color:var(--terracotta-soft)">${new Date(start.getTime()+i*86400000).getDate()}</small><textarea class="lines"></textarea></div>`).join('')}</div>`);
}
function dailyPage(d){
 const date=new Date(2027,0,4+d); const label=date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 let hrs='';for(let h=6;h<=21;h++)hrs+=`<div class="hour">${pad(h)}:00</div>`;
 page('day-'+pad(d+1),'Daily',`Day ${d+1}`,`
 <div class="sub">${label}</div><h1>Intentional Day</h1>
 <div class="daily" style="margin-top:6px"><div class="hours">${hrs}</div><div class="grid2">
 <div class="card"><h3>Top 3 Priorities</h3><input placeholder="Priority 1" style="border:none;border-bottom:1px solid var(--border-line);margin-bottom:4px"><input placeholder="Priority 2" style="border:none;border-bottom:1px solid var(--border-line);margin-bottom:4px"><input placeholder="Priority 3" style="border:none;border-bottom:1px solid var(--border-line)">${linesCard('Quick Notes','flex:1;margin-top:8px')}</div>
 <div class="card"><h3>Gratitude</h3><textarea class="lines" style="height:32mm"></textarea><h3 style="margin-top:6px">Water Tracker</h3><div class="water">${'<span class="check"></span>'.repeat(8)}</div>${linesCard('Daily Reflection','flex:1;margin-top:6px')}</div>
 </div></div>`);
}
function trackerPage(i){
 const names=['Habit Tracker','Mood Tracker','Sleep Tracker','Water Tracker','Movement Tracker','Reading Tracker','Self-Care Tracker','Meal Tracker','Screen-Time Tracker','Gratitude Tracker','Wellness Check-In','30-Day Challenge'];
 page('tracker-'+pad(i+1),'Wellness',names[i],`
 <h1>${names[i]}</h1><div class="sub">Build consistency, not perfection.</div>
 <div class="grid2" style="margin-top:8px;height:140mm">${linesCard('Monthly Tracking')} ${linesCard('Reflection & Insights')}</div>`);
}
function financePage(i){
 const names=['Monthly Budget','Expense Tracker','Savings Goals','Debt Payoff','Subscription Tracker','No-Spend Challenge','Income Tracker','Financial Goals','Wishlist Budget','Annual Money Review'];
 page('finance-'+pad(i+1),'Finance',names[i],`
 <h1>${names[i]}</h1><div class="sub">Plan • Track • Reflect</div>
 <div class="grid2" style="margin-top:8px">${checklist('Categories',8)}${linesCard('Notes & Decisions','height:135mm')}</div>`);
}
function bonusPage(i){
 const names=['Bucket List','Books to Read','Movies to Watch','Places to Visit','Gift Planner','Important Dates','Project Planner','Cleaning Schedule','Meal Planner','Packing List','Travel Planner','Study Planner','Work Planner','Content Planner','Ideas Vault'];
 page('bonus-'+pad(i+1),'Bonus',names[i],`<h1>${names[i]}</h1><div class="grid2" style="margin-top:8px;height:140mm">${checklist('Plan',8)}${linesCard('Notes','')}</div>`);
}

/* Cover (Halaman 1) */
app.insertAdjacentHTML('beforeend',`<section class="page cover" id="cover"><div class="frame"></div><span class="badge">DIGITAL PLANNER 2027</span><h1 class="ctitle">INTENTIONAL<br>LIVING PLANNER</h1><div class="divider"></div><blockquote class="quote">“Write your own story, one intentional day at a time.”</blockquote><a class="start" href="#index">ENTER PLANNER / START HERE</a></section>`);

/* 2 Halaman Navigasi Utama */
page('index','Contents','Master Index',`<h1>Master Index</h1><div class="idx">
<a href="#year"><b>01</b>Year at a Glance</a><a href="#vision"><b>02</b>Vision & Goals</a>
<a href="#quarter-1-1"><b>03</b>Quarterly Planning</a><a href="#m-01"><b>04</b>Monthly Planning</a>
<a href="#week-01"><b>05</b>Weekly Planning</a><a href="#day-01"><b>06</b>Daily Planning</a>
<a href="#finance-01"><b>07</b>Finance</a><a href="#tracker-01"><b>08</b>Wellness</a>
<a href="#bonus-01"><b>09</b>Bonus Templates</a><a href="#notes-01"><b>10</b>Notes & Brainstorming</a></div>`);
page('guide','Getting Started','How to Use Your Planner',`<h1>Welcome to Your Intentional Year</h1><div class="heroGrid" style="margin-top:8px">${linesCard('How I Want 2027 to Feel')}${checklist('Before You Begin',6)}${linesCard('My Planner Rules')}${linesCard('A Note to My Future Self')}</div>`);

/* Yearly + Vision */
page('year','Yearly','Year at a Glance',`<h1>2027 Year at a Glance</h1><div class="yeargrid" style="margin-top:8px">${MONTHS.map((m,i)=>`<div class="mini"><h3>${m}</h3><table><tr>${DAYS.map(d=>`<th>${d[0]}</th>`).join('')}</tr>${Array.from({length:5},(_,r)=>`<tr>${Array.from({length:7},(_,c)=>`<td>${r*7+c+1<=new Date(2027,i+1,0).getDate()?(r*7+c+1):''}</td>`).join('')}</tr>`).join('')}</table></div>`).join('')}</div>`);
for(let i=0;i<14;i++) page('year-extra-'+pad(i+1),'Yearly',`Annual Planning • ${i+1}`,`<h1>${['Yearly Intentions','Life Areas','Annual Priorities','Personal Growth','Career Vision','Health Vision','Relationships','Home & Environment','Learning Plan','Creative Goals','Adventure List','Things to Stop','Things to Start','End-of-Year Vision'][i]}</h1><div class="grid2" style="margin-top:8px;height:140mm">${linesCard('Reflection')}${linesCard('Action Plan')}</div>`);
page('vision','Vision & Goals','Vision Board & Annual Goals',`<h1>Vision & Annual Goals</h1><div class="heroGrid" style="margin-top:8px">${linesCard('My Vision for 2027')}${linesCard('Why This Matters')}${checklist('Top 5 Goals',5)}${linesCard('Future Me')}</div>`);
for(let i=0;i<19;i++)page('goal-'+pad(i+1),'Vision & Goals',`Goal System • ${i+1}`,`<h1>${['Goal Brain Dump','Goal Breakdown','Milestone Map','Action Steps','Quarterly Goal Map','Monthly Goal Map','Goal Habit Link','Obstacle Plan','Motivation Bank','Success Metrics','Progress Review','Goal Reset','Priority Matrix','Focus List','Project Roadmap','Dream-to-Plan','Accountability','Celebration Log','Annual Goal Review'][i]}</h1><div class="grid2" style="margin-top:8px;height:140mm">${checklist('Action Steps',8)}${linesCard('Notes & Reflection')}</div>`);

/* 24 Halaman Quarterly */
for(let q=1;q<=4;q++)for(let j=0;j<6;j++)page(`quarter-${q}-${j+1}`,'Quarterly',`Q${q} • Planning ${j+1}`,`<h1>Quarter ${q} Planning</h1><div class="sub">January–March / April–June / July–September / October–December</div><div class="grid2" style="margin-top:8px;height:140mm">${linesCard('Quarterly Focus')}${checklist('Quarterly Actions',8)}</div>`);

/* 72 Halaman Monthly */
for(let m=0;m<12;m++){monthPage(m);for(let j=0;j<5;j++)page(`m-${pad(m+1)}-extra-${j+1}`,'Monthly',`${MONTHS[m]} • ${['Goals','Habit & Mood','Finance','Self-Care','Reflection'][j]}`,`<h1>${MONTHS[m]} ${['Goals','Habit & Mood','Finance','Self-Care','Reflection'][j]}</h1><div class="grid2" style="margin-top:8px;height:140mm">${checklist('Focus',8)}${linesCard('Notes')}</div>`)}

/* 156 Halaman Weekly */
for(let w=0;w<52;w++){weeklyPage(w,0,0);for(let j=0;j<2;j++)page(`week-${pad(w+1)}-extra-${j+1}`,'Weekly',`Week ${w+1} • ${j===0?'Reflection':'Planning'}`,`<h1>Week ${w+1} ${j===0?'Reflection':'Planning'}</h1><div class="grid2" style="margin-top:8px;height:140mm">${linesCard(j===0?'Wins & Lessons':'Plan Ahead')}${checklist(j===0?'What Worked':'Priorities',8)}</div>`)}

/* 90 Halaman Daily */
for(let d=0;d<90;d++)dailyPage(d);

/* 20 Finance & 18 Wellness */
for(let i=0;i<20;i++)financePage(i);
for(let i=0;i<18;i++)trackerPage(i);

/* 12 Self-Care */
for(let i=0;i<12;i++)page('selfcare-'+pad(i+1),'Self-Care',`Self-Care • ${i+1}`,`<h1>Intentional Self-Care</h1><div class="grid2" style="margin-top:8px;height:140mm">${checklist('Care List',8)}${linesCard('How I Feel')}</div>`);

/* 15 Notes */
for(let i=0;i<15;i++)page('notes-'+pad(i+1),'Notes',`Notes • ${i+1}`,`<h1>Notes & Brainstorming</h1><div class="note" style="margin-top:8px"><textarea class="lines"></textarea></div>`);

/* 15 Bonus */
for(let i=0;i<15;i++)bonusPage(i);

/* Pengisi Otomatis Agar Total Tepat 480 Halaman */
let total=1+pages.length;
let filler=480-total;
for(let i=0;i<filler;i++)page('extra-'+pad(i+1),'Bonus','Bonus Notes',`<h1>Extra Notes & Ideas</h1><div class="note" style="margin-top:8px"><textarea class="lines"></textarea></div>`);

/* Render Semua Halaman & Pasang Navigasi Tab Samping */
const sections=[
 ['index','Index','#index'],['year','Year','#year'],['goals','Goals','#vision'],
 ['q','Quarter','#quarter-1-1'],['01','Jan','#m-01'],['02','Feb','#m-02'],['03','Mar','#m-03'],
