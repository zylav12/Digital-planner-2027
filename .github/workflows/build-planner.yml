
name: Build 2027 Planner PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "build_planner.py"
      - "planner_config.py"
      - "requirements.txt"
      - ".github/workflows/build-planner.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate planner PDF
        run: python build_planner.py

      - name: Upload planner PDF
        uses: actions/upload-artifact@v4
        with:
          name: 2027-Intentional-Life-Planner
          path: "*.pdf"
          if-no-files-found: error
